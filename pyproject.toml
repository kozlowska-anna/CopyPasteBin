[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copypastebin"
version = "1.1"
description = "Local text risk checker and redactor"
authors = [{name = "Anna Kozłowska"}]
license = {text = "GPL-3.0-or-later"}
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cpb = "copypastebin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"copypastebin.data" = ["bip39_english.txt"]
