<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">CopyPasteBin</title>
  <desc id="desc">CopyPasteBin logo and product name on a light background</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#e7f4ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <rect x="42" y="42" width="1116" height="546" rx="36" fill="#ffffff" stroke="#c8ddf1" stroke-width="4"/>
  <image href="logo-web.svg" x="470" y="96" width="260" height="260"/>
  <text x="600" y="440" fill="#071d35" font-family="system-ui, sans-serif" font-size="78" font-weight="800" text-anchor="middle">CopyPasteBin</text>
  <text x="600" y="510" fill="#42566d" font-family="system-ui, sans-serif" font-size="34" font-weight="600" text-anchor="middle">Clipboard Manager for GNOME</text>
