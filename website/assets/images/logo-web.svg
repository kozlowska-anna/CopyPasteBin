<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="back-paper" x1="18" y1="14" x2="88" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#235f91"/>
      <stop offset="0.52" stop-color="#173f70"/>
      <stop offset="1" stop-color="#35285f"/>
    </linearGradient>
    <linearGradient id="front-paper" x1="48" y1="28" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#173f69"/>
      <stop offset="0.56" stop-color="#102f53"/>
      <stop offset="1" stop-color="#0a2340"/>
    </linearGradient>
    <linearGradient id="outline" x1="20" y1="16" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#85dcff"/>
      <stop offset="0.48" stop-color="#42b8f5"/>
      <stop offset="1" stop-color="#527ce8"/>
    </linearGradient>
    <linearGradient id="risk-low" x1="78" y1="55" x2="102" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#50c8ff"/>
      <stop offset="1" stop-color="#278be2"/>
    </linearGradient>
    <linearGradient id="risk-medium" x1="56" y1="68" x2="87" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd12e"/>
      <stop offset="1" stop-color="#e89600"/>
    </linearGradient>
    <linearGradient id="risk-high" x1="78" y1="87" x2="102" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5a69"/>
      <stop offset="1" stop-color="#e31f42"/>
    </linearGradient>
    <linearGradient id="risk-critical" x1="56" y1="100" x2="87" y2="107" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c92f52"/>
      <stop offset="1" stop-color="#8d102f"/>
    </linearGradient>
    <filter id="document-shadow" x="5" y="5" width="122" height="123" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="2.6" flood-color="#071523" flood-opacity=".52"/>
    </filter>
    <filter id="outline-glow" x="7" y="5" width="120" height="122" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.35" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#document-shadow)">
    <rect x="15" y="14" width="73" height="91" rx="12" fill="url(#back-paper)" stroke="#071d35" stroke-width="7"/>
    <rect x="15" y="14" width="73" height="91" rx="12" fill="none" stroke="url(#outline)" stroke-width="4" filter="url(#outline-glow)"/>
    <g fill="#b9daf2">
      <rect x="27" y="34" width="42" height="4" rx="2"/>
      <rect x="27" y="47" width="42" height="4" rx="2" opacity=".9"/>
      <rect x="27" y="60" width="42" height="4" rx="2" opacity=".82"/>
      <rect x="27" y="73" width="42" height="4" rx="2" opacity=".74"/>
      <rect x="27" y="86" width="25" height="4" rx="2" opacity=".68"/>
    </g>
  </g>

  <g filter="url(#document-shadow)">
    <rect x="45" y="27" width="69" height="90" rx="12" fill="url(#front-paper)" stroke="#071d35" stroke-width="7"/>
    <rect x="45" y="27" width="69" height="90" rx="12" fill="none" stroke="url(#outline)" stroke-width="4" filter="url(#outline-glow)"/>
    <g fill="#bddcf2">
      <rect x="56" y="43" width="43" height="4" rx="2"/>
      <rect x="56" y="62" width="17" height="4" rx="2" opacity=".9"/>
      <rect x="83" y="62" width="19" height="4" rx="2" opacity=".82"/>
      <rect x="56" y="75" width="46" height="4" rx="2" opacity=".76"/>
      <rect x="56" y="94" width="21" height="4" rx="2" opacity=".7"/>
      <rect x="84" y="94" width="18" height="4" rx="2" opacity=".66"/>
      <rect x="56" y="107" width="35" height="4" rx="2" opacity=".62"/>
    </g>
    <rect x="78" y="55" width="24" height="7" rx="3.5" fill="url(#risk-low)"/>
    <rect x="56" y="68" width="31" height="7" rx="3.5" fill="url(#risk-medium)"/>
    <rect x="78" y="87" width="24" height="7" rx="3.5" fill="url(#risk-high)"/>
    <rect x="56" y="100" width="31" height="7" rx="3.5" fill="url(#risk-critical)"/>
